<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="600" viewBox="0 0 1260 600" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<style>
  text { fill: #243447; }
  .title { font-size: 26px; font-weight: 700; }
  .sub   { font-size: 16.5px; fill: #526477; }
  .hd    { font-size: 15px; font-weight: 700; }
  .bx    { font-size: 14px; font-weight: 700; }
  .lb    { font-size: 13px; }
  .note  { font-size: 13px; fill: #526477; }
  .op    { font-size: 24px; font-weight: 700; }
  .blue  { fill: #3576A8; }
  .orng  { fill: #E4492C; }
  .purp  { fill: #7861A8; }
  .muted { fill: #526477; }
  /* Dark theme: follows the viewer's prefers-color-scheme. Renderers without
     media-query support keep the light colors from the presentation attributes. */
  @media (prefers-color-scheme: dark) {
    text { fill: #E5E7EB; }
    .sub, .note, .sm, .muted { fill: #9CA3AF; }
    .blue { fill: #7DB7E6; }
    .orng { fill: #F58B77; }
    .purp { fill: #B9A6E6; }
    [fill="#ffffff"] { fill: #1F2937; }
    [fill="#DCEAF5"] { fill: #17344D; }
    [fill="#FDE2DA"] { fill: #4A2219; }
    [fill="#FFF0EB"] { fill: #3A1D17; }
    [fill="#FFF0D3"] { fill: #3F3216; }
    [fill="#FFF7E8"] { fill: #2F2714; }
    [fill="#E9E2F4"] { fill: #302848; }
    [fill="#7D8E9E"] { fill: #8B9AAB; }
    [stroke="#3576A8"] { stroke: #5B9BD5; }
    [stroke="#E4492C"] { stroke: #F06A50; }
    [stroke="#D9A441"] { stroke: #E0B050; }
    [stroke="#7861A8"] { stroke: #9F8AD8; }
    [stroke="#CBD5DF"] { stroke: #4B5563; }
    [stroke="#E4E8ED"] { stroke: #374151; }
    [stroke="#7D8E9E"] { stroke: #8B9AAB; }
    [stroke="#9AA5B1"] { stroke: #6B7785; }
    .bg { fill: #111827; }
  }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7D8E9E"/>
  </marker>
</defs>

<rect class="bg" width="1260" height="600" fill="#ffffff"/>

<text x="44" y="50" class="title">Attention: dual-wave software pipeline</text>
<text x="44" y="80" class="sub">Forward kernel, head_dim ≤ 256 · two KV tiles in flight per wave · two wave groups one phase apart</text>

<!-- ===== One KV tile ===== -->
<text x="44" y="128" class="hd">One KV tile</text>

<rect x="44"  y="150" width="56" height="60" rx="6" fill="#DCEAF5" stroke="#3576A8" stroke-width="1.5"/>
<text x="72"  y="186" class="bx" text-anchor="middle">Q</text>
<text x="118" y="189" class="op" text-anchor="middle">×</text>
<rect x="136" y="150" width="56" height="60" rx="6" fill="#FFF0D3" stroke="#D9A441" stroke-width="1.5"/>
<text x="164" y="186" class="bx" text-anchor="middle">Kᵀ</text>
<path d="M200,180 L232,180" stroke="#7D8E9E" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="240" y="150" width="56" height="60" rx="6" fill="#ffffff" stroke="#CBD5DF" stroke-width="1.5"/>
<text x="268" y="186" class="bx" text-anchor="middle">S</text>
<path d="M304,180 L384,180" stroke="#7D8E9E" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="344" y="170" class="lb purp" text-anchor="middle">softmax</text>
<rect x="392" y="150" width="56" height="60" rx="6" fill="#ffffff" stroke="#CBD5DF" stroke-width="1.5"/>
<text x="420" y="186" class="bx" text-anchor="middle">P</text>
<text x="466" y="189" class="op" text-anchor="middle">×</text>
<rect x="484" y="150" width="56" height="60" rx="6" fill="#FFF0D3" stroke="#D9A441" stroke-width="1.5"/>
<text x="512" y="186" class="bx" text-anchor="middle">V</text>
<path d="M548,180 L580,180" stroke="#7D8E9E" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="588" y="150" width="56" height="60" rx="6" fill="#DCEAF5" stroke="#3576A8" stroke-width="1.5"/>
<text x="616" y="186" class="bx" text-anchor="middle">O</text>

<text x="168" y="238" class="lb orng" text-anchor="middle">QK · matrix cores</text>
<text x="344" y="238" class="lb purp" text-anchor="middle">vector units</text>
<text x="516" y="238" class="lb orng" text-anchor="middle">PV · matrix cores</text>

<rect x="44"  y="262" width="14" height="14" rx="3" fill="#DCEAF5" stroke="#3576A8"/>
<text x="66"  y="274" class="note">stays in registers</text>
<rect x="210" y="262" width="14" height="14" rx="3" fill="#FFF0D3" stroke="#D9A441"/>
<text x="232" y="274" class="note">streamed through two LDS buffers</text>

<line x1="680" y1="110" x2="680" y2="290" stroke="#E4E8ED" stroke-width="1.5"/>

<!-- ===== Two tiles in flight ===== -->
<text x="712" y="128" class="hd">Two tiles in flight · one wave</text>

<text x="712" y="175" class="lb orng">Matrix cores</text>
<rect x="830"  y="150" width="90" height="40" rx="6" fill="#FFF0EB" stroke="#E4492C" stroke-width="1.5"/>
<text x="875"  y="175" class="lb" text-anchor="middle">QK t</text>
<rect x="926"  y="150" width="90" height="40" rx="6" fill="#FFF0EB" stroke="#E4492C" stroke-width="1.5"/>
<text x="971"  y="175" class="lb" text-anchor="middle">PV t−1</text>
<rect x="1022" y="150" width="90" height="40" rx="6" fill="#FFF0EB" stroke="#E4492C" stroke-width="1.5"/>
<text x="1067" y="175" class="lb" text-anchor="middle">QK t+1</text>
<rect x="1118" y="150" width="90" height="40" rx="6" fill="#FFF0EB" stroke="#E4492C" stroke-width="1.5"/>
<text x="1163" y="175" class="lb" text-anchor="middle">PV t</text>

<text x="712" y="235" class="lb purp">Vector units</text>
<rect x="830"  y="210" width="90"  height="40" rx="6" fill="#E9E2F4" stroke="#7861A8" stroke-width="1.5"/>
<text x="875"  y="235" class="lb" text-anchor="middle">softmax t−1</text>
<rect x="926"  y="210" width="186" height="40" rx="6" fill="#E9E2F4" stroke="#7861A8" stroke-width="1.5"/>
<text x="1019" y="235" class="lb" text-anchor="middle">softmax t</text>
<rect x="1118" y="210" width="90"  height="40" rx="6" fill="#E9E2F4" stroke="#7861A8" stroke-width="1.5"/>
<text x="1163" y="235" class="lb" text-anchor="middle">softmax t+1</text>

<text x="712" y="274" class="note">Each matrix-core step runs beside the softmax of a neighbouring tile.</text>

<line x1="44" y1="314" x2="1216" y2="314" stroke="#E4E8ED" stroke-width="1.5"/>

<!-- ===== Phase-staggered wave groups ===== -->
<text x="44" y="350" class="hd">Phase-staggered wave groups</text>
<text x="1216" y="350" class="note" text-anchor="end">Schematic</text>
<path d="M230,372 L1208,372" stroke="#7D8E9E" stroke-width="1.8" marker-end="url(#ar)"/>

<text x="44" y="424" class="hd blue">Group 0</text>
<text x="44" y="494" class="hd orng">Group 1</text>

<!-- group 0 -->
<rect x="230" y="392" width="150" height="52" rx="7" fill="#FFF0D3" stroke="#D9A441" stroke-width="1.5"/>
<text x="305" y="423" class="bx" text-anchor="middle">Load K / V</text>
<rect x="390" y="392" width="150" height="52" rx="7" fill="#DCEAF5" stroke="#3576A8" stroke-width="1.5"/>
<text x="465" y="414" class="bx blue" text-anchor="middle">MFMA</text>
<text x="465" y="433" class="bx blue" text-anchor="middle">+ softmax</text>
<rect x="550" y="392" width="150" height="52" rx="7" fill="#FFF0D3" stroke="#D9A441" stroke-width="1.5"/>
<text x="625" y="423" class="bx" text-anchor="middle">Load K / V</text>
<rect x="710" y="392" width="150" height="52" rx="7" fill="#DCEAF5" stroke="#3576A8" stroke-width="1.5"/>
<text x="785" y="414" class="bx blue" text-anchor="middle">MFMA</text>
<text x="785" y="433" class="bx blue" text-anchor="middle">+ softmax</text>
<rect x="870" y="392" width="150" height="52" rx="7" fill="#FFF0D3" stroke="#D9A441" stroke-width="1.5"/>
<text x="945" y="423" class="bx" text-anchor="middle">Load K / V</text>
<rect x="1030" y="392" width="150" height="52" rx="7" fill="#DCEAF5" stroke="#3576A8" stroke-width="1.5"/>
<text x="1105" y="414" class="bx blue" text-anchor="middle">MFMA</text>
<text x="1105" y="433" class="bx blue" text-anchor="middle">+ softmax</text>
<text x="1200" y="424" class="op muted" text-anchor="middle">…</text>

<!-- group 1 -->
<rect x="230" y="462" width="150" height="52" rx="7" fill="#FDE2DA" stroke="#E4492C" stroke-width="1.5"/>
<text x="305" y="484" class="bx orng" text-anchor="middle">MFMA</text>
<text x="305" y="503" class="bx orng" text-anchor="middle">+ softmax</text>
<rect x="390" y="462" width="150" height="52" rx="7" fill="#FFF0D3" stroke="#D9A441" stroke-width="1.5"/>
<text x="465" y="493" class="bx" text-anchor="middle">Load K / V</text>
<rect x="550" y="462" width="150" height="52" rx="7" fill="#FDE2DA" stroke="#E4492C" stroke-width="1.5"/>
<text x="625" y="484" class="bx orng" text-anchor="middle">MFMA</text>
<text x="625" y="503" class="bx orng" text-anchor="middle">+ softmax</text>
<rect x="710" y="462" width="150" height="52" rx="7" fill="#FFF0D3" stroke="#D9A441" stroke-width="1.5"/>
<text x="785" y="493" class="bx" text-anchor="middle">Load K / V</text>
<rect x="870" y="462" width="150" height="52" rx="7" fill="#FDE2DA" stroke="#E4492C" stroke-width="1.5"/>
<text x="945" y="484" class="bx orng" text-anchor="middle">MFMA</text>
<text x="945" y="503" class="bx orng" text-anchor="middle">+ softmax</text>
<rect x="1030" y="462" width="150" height="52" rx="7" fill="#FFF0D3" stroke="#D9A441" stroke-width="1.5"/>
<text x="1105" y="493" class="bx" text-anchor="middle">Load K / V</text>
<text x="1200" y="494" class="op muted" text-anchor="middle">…</text>

<!-- barriers -->
<line x1="385"  y1="384" x2="385"  y2="522" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="2 4"/>
<line x1="545"  y1="384" x2="545"  y2="522" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="2 4"/>
<line x1="705"  y1="384" x2="705"  y2="522" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="2 4"/>
<line x1="865"  y1="384" x2="865"  y2="522" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="2 4"/>
<line x1="1025" y1="384" x2="1025" y2="522" stroke="#9AA5B1" stroke-width="1.2" stroke-dasharray="2 4"/>

<text x="630" y="556" class="lb" text-anchor="middle" font-size="14">Group 1 starts one phase late, so at every barrier the two groups swap between loading and computing.</text>
<text x="630" y="580" class="note" text-anchor="middle">Shown for the 8-wave builds (head_dim 64 and 128). head_dim 512 uses the wide-head body.</text>
</svg>
