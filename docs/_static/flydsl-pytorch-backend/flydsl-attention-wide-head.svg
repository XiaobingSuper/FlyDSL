<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="600" viewBox="0 0 1260 600" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<style>
  text { fill: #243447; }
  .title { font-size: 26px; font-weight: 700; }
  .sub   { font-size: 16.5px; fill: #526477; }
  .hd    { font-size: 15px; font-weight: 700; }
  .bx    { font-size: 14px; font-weight: 700; }
  .lb    { font-size: 13px; }
  .sm    { font-size: 12px; fill: #526477; }
  .note  { font-size: 13px; fill: #526477; }
  .op    { font-size: 24px; font-weight: 700; }
  .blue  { fill: #3576A8; }
  .orng  { fill: #E4492C; }
  .purp  { fill: #7861A8; }
  .muted { fill: #526477; }
  /* Dark theme: follows the viewer's prefers-color-scheme. Renderers without
     media-query support keep the light colors from the presentation attributes. */
  @media (prefers-color-scheme: dark) {
    text { fill: #E5E7EB; }
    .sub, .note, .sm, .muted { fill: #9CA3AF; }
    .blue { fill: #7DB7E6; }
    .orng { fill: #F58B77; }
    .purp { fill: #B9A6E6; }
    [fill="#ffffff"] { fill: #1F2937; }
    [fill="#DCEAF5"] { fill: #17344D; }
    [fill="#FDE2DA"] { fill: #4A2219; }
    [fill="#FFF0EB"] { fill: #3A1D17; }
    [fill="#FFF0D3"] { fill: #3F3216; }
    [fill="#FFF7E8"] { fill: #2F2714; }
    [fill="#E9E2F4"] { fill: #302848; }
    [fill="#7D8E9E"] { fill: #8B9AAB; }
    [stroke="#3576A8"] { stroke: #5B9BD5; }
    [stroke="#E4492C"] { stroke: #F06A50; }
    [stroke="#D9A441"] { stroke: #E0B050; }
    [stroke="#7861A8"] { stroke: #9F8AD8; }
    [stroke="#CBD5DF"] { stroke: #4B5563; }
    [stroke="#E4E8ED"] { stroke: #374151; }
    [stroke="#7D8E9E"] { stroke: #8B9AAB; }
    [stroke="#9AA5B1"] { stroke: #6B7785; }
    .bg { fill: #111827; }
  }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7D8E9E"/>
  </marker>
</defs>

<rect class="bg" width="1260" height="600" fill="#ffffff"/>

<text x="44" y="50" class="title">Attention: wide head dimension</text>
<text x="44" y="80" class="sub">Forward kernel, head_dim 512 · one KV tile at a time · head dimension staged in two halves · output split across two waves</text>

<!-- ===== Staging in time ===== -->
<text x="44" y="128" class="hd">Stage the head dimension through LDS</text>

<text x="204" y="160" class="lb" text-anchor="middle">K or V tile · 64 rows × 512</text>
<rect x="44"  y="172" width="160" height="70" fill="#FFF0D3" stroke="#D9A441" stroke-width="1.5"/>
<rect x="204" y="172" width="160" height="70" fill="#FFF7E8" stroke="#D9A441" stroke-width="1.5"/>
<text x="124" y="204" class="bx" text-anchor="middle">half 0</text>
<text x="124" y="224" class="sm" text-anchor="middle">columns 0–255</text>
<text x="284" y="204" class="bx" text-anchor="middle">half 1</text>
<text x="284" y="224" class="sm" text-anchor="middle">columns 256–511</text>

<path d="M364,190 L452,172" stroke="#7D8E9E" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M364,226 L452,244" stroke="#7D8E9E" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="460" y="150" width="180" height="42" rx="7" fill="#FFF0D3" stroke="#D9A441" stroke-width="1.5"/>
<text x="550" y="176" class="bx" text-anchor="middle">LDS buffer 0</text>
<rect x="460" y="222" width="180" height="42" rx="7" fill="#FFF7E8" stroke="#D9A441" stroke-width="1.5"/>
<text x="550" y="248" class="bx" text-anchor="middle">LDS buffer 1</text>

<text x="44" y="290" class="note">Double-buffering whole K and V tiles would need 266 KiB of LDS, against 160 KiB.</text>
<text x="44" y="308" class="note">Halves need 133 KiB, and one half loads while the other is multiplied.</text>

<line x1="680" y1="110" x2="680" y2="312" stroke="#E4E8ED" stroke-width="1.5"/>

<!-- ===== Sharding across waves ===== -->
<text x="712" y="128" class="hd">Split the output across waves</text>

<rect x="712" y="160" width="104" height="40" rx="7" fill="#DCEAF5" stroke="#3576A8" stroke-width="1.5"/>
<text x="764" y="185" class="bx blue" text-anchor="middle">Wave A</text>
<rect x="712" y="214" width="104" height="40" rx="7" fill="#FDE2DA" stroke="#E4492C" stroke-width="1.5"/>
<text x="764" y="239" class="bx orng" text-anchor="middle">Wave B</text>

<path d="M824,207 L868,207" stroke="#7D8E9E" stroke-width="1.8" marker-end="url(#ar)"/>

<text x="1046" y="160" class="lb" text-anchor="middle">O tile · 32 rows × 512</text>
<rect x="876"  y="172" width="85" height="70" fill="#DCEAF5" stroke="#3576A8" stroke-width="1.5"/>
<rect x="961"  y="172" width="85" height="70" fill="#FDE2DA" stroke="#E4492C" stroke-width="1.5"/>
<rect x="1046" y="172" width="85" height="70" fill="#DCEAF5" stroke="#3576A8" stroke-width="1.5"/>
<rect x="1131" y="172" width="85" height="70" fill="#FDE2DA" stroke="#E4492C" stroke-width="1.5"/>
<text x="918"  y="212" class="bx blue" text-anchor="middle">A</text>
<text x="1003" y="212" class="bx orng" text-anchor="middle">B</text>
<text x="1088" y="212" class="bx blue" text-anchor="middle">A</text>
<text x="1173" y="212" class="bx orng" text-anchor="middle">B</text>
<text x="918"  y="260" class="sm" text-anchor="middle">0–127</text>
<text x="1003" y="260" class="sm" text-anchor="middle">128–255</text>
<text x="1088" y="260" class="sm" text-anchor="middle">256–383</text>
<text x="1173" y="260" class="sm" text-anchor="middle">384–511</text>

<text x="712" y="290" class="note">Both waves compute the same scores; each accumulates half of O,</text>
<text x="712" y="308" class="note">so the accumulator fits in registers and no data is exchanged.</text>

<line x1="44" y1="334" x2="1216" y2="334" stroke="#E4E8ED" stroke-width="1.5"/>

<!-- ===== One KV tile, over time ===== -->
<text x="44" y="368" class="hd">One KV tile</text>
<text x="1216" y="368" class="note" text-anchor="end">Schematic</text>
<path d="M230,388 L1208,388" stroke="#7D8E9E" stroke-width="1.8" marker-end="url(#ar)"/>

<text x="44" y="430" class="hd">Compute</text>
<text x="44" y="496" class="hd">Loads in flight</text>

<rect x="230"  y="404" width="186" height="44" rx="7" fill="#FFF0EB" stroke="#E4492C" stroke-width="1.5"/>
<text x="323"  y="431" class="bx orng" text-anchor="middle">QK · half 0</text>
<rect x="426"  y="404" width="186" height="44" rx="7" fill="#FFF0EB" stroke="#E4492C" stroke-width="1.5"/>
<text x="519"  y="431" class="bx orng" text-anchor="middle">QK · half 1</text>
<rect x="622"  y="404" width="186" height="44" rx="7" fill="#E9E2F4" stroke="#7861A8" stroke-width="1.5"/>
<text x="715"  y="431" class="bx purp" text-anchor="middle">softmax</text>
<rect x="818"  y="404" width="186" height="44" rx="7" fill="#FFF0EB" stroke="#E4492C" stroke-width="1.5"/>
<text x="911"  y="431" class="bx orng" text-anchor="middle">PV · half 0</text>
<rect x="1014" y="404" width="186" height="44" rx="7" fill="#FFF0EB" stroke="#E4492C" stroke-width="1.5"/>
<text x="1107" y="431" class="bx orng" text-anchor="middle">PV · half 1</text>

<rect x="230"  y="462" width="186" height="34" rx="6" fill="#FFF0D3" stroke="#D9A441" stroke-width="1.5"/>
<text x="323"  y="484" class="lb" text-anchor="middle">K half 1</text>
<rect x="818"  y="462" width="186" height="34" rx="6" fill="#FFF0D3" stroke="#D9A441" stroke-width="1.5"/>
<text x="911"  y="484" class="lb" text-anchor="middle">V half 1</text>
<rect x="230"  y="504" width="578" height="34" rx="6" fill="#FFF7E8" stroke="#D9A441" stroke-width="1.5"/>
<text x="519"  y="526" class="lb" text-anchor="middle">V half 0</text>
<rect x="818"  y="504" width="382" height="34" rx="6" fill="#FFF7E8" stroke="#D9A441" stroke-width="1.5"/>
<text x="1009" y="526" class="lb" text-anchor="middle">next tile's K half 0</text>

<text x="630" y="574" class="lb" text-anchor="middle" font-size="14">Every load is issued while an earlier multiply runs, so loading overlaps compute instead of stalling it.</text>
</svg>
